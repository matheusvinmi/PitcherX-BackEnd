<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Solicitação Aprovada - PitcherX</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #4a90e2; color: white; padding: 20px; text-align: center; }
        .content { background-color: #f9f9f9; padding: 20px; border-radius: 5px; }
        .footer { font-size: 12px; color: #777; text-align: center; padding: 20px; }
        .button { display: inline-block; background-color: #4a90e2; color: white; padding: 10px 20px; 
                   text-decoration: none; border-radius: 4px; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Solicitação Aprovada</h2>
        </div>
        <div class="content">
            <p>Olá <strong>${nomeSolicitante}</strong>,</p>
            <p>Sua solicitação para se tornar <strong>${tipoConcedido}</strong> no projeto <strong>${nomeProjeto}</strong> foi <strong>aprovada</strong> pelo criador <strong>${nomeCriador}</strong>.</p>
            <parabéns! Você agora tem acesso aos recursos do projeto como ${tipoConcedido.toLowerCase()}.</p>
            <p>Atenciosamente,<br/>Equipe PitcherX</p>
        </div>
        <div class="footer">
            <p>© ${ano} PitcherX. Todos os direitos reservados.</p>
        </div>
    </div>
</body>
</html>
