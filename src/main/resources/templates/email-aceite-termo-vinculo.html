<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Termos de Vínculo Aceitos - PitcherX</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #4a90e2; color: white; padding: 20px; text-align: center; }
        .content { background-color: #f9f9f9; padding: 20px; border-radius: 5px; }
        .footer { font-size: 12px; color: #777; text-align: center; padding: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Termos de Vínculo Aceitos</h2>
        </div>
        <div class="content">
            <p>Olá, <strong th:text="${nome}">Usuário</strong>!</p>
            <p>Parabéns! Você aceitou os termos de vinculo do projeto.</p>
            <p>ID do Projeto: <strong th:text="${projetoId}">ID do Projeto</strong></p>
            <p>Agora você pode visualizar o projeto por completo e participar das suas atividades.</p>
            <p>Atenciosamente,<br/>Equipe PitcherX</p>
        </div>
        <div class="footer">
            <p>© <span th:text="${ano}">2026</span> PitcherX. Todos os direitos reservados.</p>
        </div>
    </div>
</body>
</html>
